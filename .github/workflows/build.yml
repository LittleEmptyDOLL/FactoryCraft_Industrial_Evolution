name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Independent jobs include all thirty restored schema-4 chains plus direct circuits; historical worlds remain archives.
# Only main pushes and pull requests trigger automatically, avoiding duplicate branch-push CI.
jobs:
  build:
    name: Build and JUnit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run validation
        run: |
          ./gradlew build
          python tools/check_space_age_research.py
          python tools/check_nuclear_reference.py
          python tools/check_rail_reference.py
          python tools/check_train_reference.py
          mkdir -p build/rail-kernel
          javac -d build/rail-kernel src/main/java/factorycraft/simulation/rail/*.java src/main/java/factorycraft/simulation/trains/*.java tools/RailwayBenchmark.java
          java -cp build/rail-kernel RailwayBenchmark > build/reports/rail-kernel.txt
          javac -cp build/rail-kernel -d build/rail-kernel tools/RailPlacementProfile.java
          java -Xms512m -Xmx512m -cp build/rail-kernel RailPlacementProfile > build/reports/rail-placement.txt
          mkdir -p build/train-kernel
          javac -d build/train-kernel src/main/java/factorycraft/simulation/rail/*.java src/main/java/factorycraft/simulation/trains/*.java tools/TrainKernelBenchmark.java
          java -cp build/train-kernel TrainKernelBenchmark > build/reports/train-kernel.jsonl
          mkdir -p build/combat-kernel
          javac -d build/combat-kernel src/main/java/factorycraft/simulation/combat/{ShotClock,Resistance}.java tools/CombatKernelBenchmark.java
          java -cp build/combat-kernel CombatKernelBenchmark > build/reports/combat-kernel.txt
          javac -d build/combat-kernel src/main/java/factorycraft/simulation/EnergyBuffer.java src/main/java/factorycraft/simulation/combat/LaserStandby.java tools/PostReleaseBenchmark.java
          java -cp build/combat-kernel PostReleaseBenchmark > build/reports/postrelease-kernel.txt
          mkdir -p build/fluid-kernel
          javac -d build/fluid-kernel src/main/java/factorycraft/simulation/fluids/{FluidCell,FluidUnits,FluidTransport,PipelineNetwork}.java tools/FluidSegmentBenchmark.java tools/FluidTopologyProfile.java
          java -cp build/fluid-kernel FluidSegmentBenchmark > build/reports/fluid-kernel.txt
          cat build/reports/fluid-kernel.txt
          java -cp build/fluid-kernel FluidTopologyProfile 0.31.1 > build/reports/fluid-topology.jsonl
          python tools/profile_resources.py > build/reports/resource-geometry.jsonl
      - name: Upload reports and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factorycraft-build
          if-no-files-found: ignore
          path: |
            build/libs/*.jar
            build/reports/tests/
            build/reports/rail-kernel.txt
            build/reports/rail-placement.txt
            build/reports/train-kernel.jsonl
            build/reports/combat-kernel.txt
            build/reports/fluid-kernel.txt
            build/reports/fluid-topology.jsonl
            build/reports/resource-geometry.jsonl

  gametests:
    name: Native GameTests and separate-process reload
    runs-on: ubuntu-latest
    env:
      JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run validation
        run: |
          ./gradlew runGameTestServer
          ./gradlew runGameTestServer
      - name: Upload reports and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factorycraft-gametests
          if-no-files-found: ignore
          path: |
            build/reports/
            run-gametest/**/reports/
            run-gametest/**/logs/latest.log

  compatibility:
    name: FTB Teams, EMI, JEI, Jade and Apothic compatibility
    runs-on: ubuntu-latest
    env:
      JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run validation
        run: |
          python tools/download_optional_mods.py build/optional-runtime
          ./gradlew runGameTestServer -PwithViewers=true -PwithJade=true -PftbModsDir=build/optional-runtime
      - name: Upload reports and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factorycraft-compatibility
          if-no-files-found: ignore
          path: |
            build/reports/
            run-gametest/**/reports/
            run-gametest/**/logs/latest.log

  benchmark:
    name: Full factory benchmark and disk reload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run validation
        run: |
          ./gradlew runBenchmarkServer
          ./gradlew runBenchmarkServer -PbenchmarkMode=verify
      - name: Upload reports and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factorycraft-benchmark
          if-no-files-found: ignore
          path: |
            run-benchmark/full-v0311/reports/

  mixed_benchmark:
    name: Mixed 3D factory, chunk unload and reload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run validation
        run: |
          ./gradlew runBenchmarkServer -PbenchmarkProfile=mixed
          ./gradlew runBenchmarkServer -PbenchmarkProfile=mixed -PbenchmarkMode=verify
      - name: Upload reports and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factorycraft-mixed-benchmark
          if-no-files-found: ignore
          path: |
            run-benchmark/mixed-v0311/reports/

  fluid_performance:
    name: Isolated 10000-pipe server workload and restart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Real fluids and exact checkpoint
        run: |
          ./gradlew runFluidBenchmarkServer -PfluidFixture=fluids-v0311-ci
          ./gradlew runFluidBenchmarkServer -PfluidFixture=fluids-v0311-ci -PfluidMode=verify
      - name: Upload fluid evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factorycraft-fluid-performance
          if-no-files-found: ignore
          path: |
            run-benchmark/fluids-v0311-ci/reports/
            run-benchmark/fluids-v0311-ci/checkpoint.json

  train_performance:
    name: Eight real trains, long consists, chunk unload and JVM reload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Actual rail stock and exact checkpoint
        run: |
          ./gradlew runTrainBenchmarkServer -PtrainFixture=trains-v0311-ci
          ./gradlew runTrainBenchmarkServer -PtrainFixture=trains-v0311-ci -PtrainMode=verify
      - name: Upload train evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factorycraft-train-performance
          if-no-files-found: ignore
          path: |
            run-benchmark/trains-v0311-ci/reports/
            run-benchmark/trains-v0311-ci/checkpoint.nbt
            run-benchmark/trains-v0311-ci/logs/latest.log

  automatic_train_performance:
    name: Eight driverless trains, signals, limits and independent JVM
    runs-on: ubuntu-latest
    env:
      JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Native automatic traffic and exact checkpoint
        run: |
          ./gradlew runTrainBenchmarkServer -PtrainControl=automatic -PtrainFixture=trains-v0320-auto-ci
          ./gradlew runTrainBenchmarkServer -PtrainControl=automatic -PtrainFixture=trains-v0320-auto-ci -PtrainMode=verify
      - name: Upload automatic train evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factorycraft-automatic-train-performance
          if-no-files-found: ignore
          path: |
            run-benchmark/trains-v0320-auto-ci/reports/
            run-benchmark/trains-v0320-auto-ci/checkpoint.nbt
            run-benchmark/trains-v0320-auto-ci/logs/latest.log
