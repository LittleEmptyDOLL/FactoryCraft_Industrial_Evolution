name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Independent jobs include all thirty restored schema-4 chains plus direct circuits; historical worlds remain archives.
# Only main pushes and pull requests trigger automatically, avoiding duplicate branch-push CI.
jobs:
  build:
    name: Build and JUnit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run validation
        run: |
          ./gradlew build
      - name: Upload reports and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factorycraft-build
          if-no-files-found: ignore
          path: |
            build/libs/*.jar
            build/reports/tests/

  gametests:
    name: Native GameTests and separate-process reload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run validation
        run: |
          ./gradlew runGameTestServer
          ./gradlew runGameTestServer
      - name: Upload reports and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factorycraft-gametests
          if-no-files-found: ignore
          path: |
            build/reports/
            run-gametest/v0220/reports/

  compatibility:
    name: FTB Teams, EMI, JEI and Jade compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run validation
        run: |
          python tools/download_optional_mods.py build/optional-runtime
          ./gradlew runGameTestServer -PwithViewers=true -PwithJade=true -PftbModsDir=build/optional-runtime
      - name: Upload reports and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factorycraft-compatibility
          if-no-files-found: ignore
          path: |
            build/reports/
            run-gametest/v0220/reports/

  benchmark:
    name: Full factory benchmark and disk reload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run validation
        run: |
          ./gradlew runBenchmarkServer
          ./gradlew runBenchmarkServer -PbenchmarkMode=verify
      - name: Upload reports and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factorycraft-benchmark
          if-no-files-found: ignore
          path: |
            run-benchmark/full-v0220/reports/

  mixed_benchmark:
    name: Mixed 3D factory, chunk unload and reload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run validation
        run: |
          ./gradlew runBenchmarkServer -PbenchmarkProfile=mixed
          ./gradlew runBenchmarkServer -PbenchmarkProfile=mixed -PbenchmarkMode=verify
      - name: Upload reports and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factorycraft-mixed-benchmark
          if-no-files-found: ignore
          path: |
            run-benchmark/mixed-v0220/reports/
