name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Independent jobs include all thirty restored schema-4 chains plus direct circuits; historical worlds remain archives.
# Only main pushes and pull requests trigger automatically, avoiding duplicate branch-push CI.
jobs:
  build:
    name: Build and JUnit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run validation
        run: |
          ./gradlew build
          mkdir -p build/fluid-kernel
          javac -d build/fluid-kernel src/main/java/factorycraft/simulation/fluids/{FluidCell,FluidUnits,FluidTransport,PipelineNetwork}.java tools/FluidSegmentBenchmark.java tools/FluidTopologyProfile.java
          java -cp build/fluid-kernel FluidSegmentBenchmark > build/reports/fluid-kernel.txt
          cat build/reports/fluid-kernel.txt
          java -cp build/fluid-kernel FluidTopologyProfile 0.24.1 > build/reports/fluid-topology.jsonl
      - name: Upload reports and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factorycraft-build
          if-no-files-found: ignore
          path: |
            build/libs/*.jar
            build/reports/tests/
            build/reports/fluid-kernel.txt
            build/reports/fluid-topology.jsonl

  gametests:
    name: Native GameTests and separate-process reload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run validation
        run: |
          ./gradlew runGameTestServer
          ./gradlew runGameTestServer
      - name: Upload reports and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factorycraft-gametests
          if-no-files-found: ignore
          path: |
            build/reports/
            run-gametest/v0241/reports/

  compatibility:
    name: FTB Teams, EMI, JEI and Jade compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run validation
        run: |
          python tools/download_optional_mods.py build/optional-runtime
          ./gradlew runGameTestServer -PwithViewers=true -PwithJade=true -PftbModsDir=build/optional-runtime
      - name: Upload reports and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factorycraft-compatibility
          if-no-files-found: ignore
          path: |
            build/reports/
            run-gametest/v0241/reports/

  benchmark:
    name: Full factory benchmark and disk reload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run validation
        run: |
          ./gradlew runBenchmarkServer
          ./gradlew runBenchmarkServer -PbenchmarkMode=verify
      - name: Upload reports and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factorycraft-benchmark
          if-no-files-found: ignore
          path: |
            run-benchmark/full-v0241/reports/

  mixed_benchmark:
    name: Mixed 3D factory, chunk unload and reload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run validation
        run: |
          ./gradlew runBenchmarkServer -PbenchmarkProfile=mixed
          ./gradlew runBenchmarkServer -PbenchmarkProfile=mixed -PbenchmarkMode=verify
      - name: Upload reports and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factorycraft-mixed-benchmark
          if-no-files-found: ignore
          path: |
            run-benchmark/mixed-v0241/reports/

  fluid_performance:
    name: Isolated 10000-pipe server workload and restart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Real fluids and exact checkpoint
        run: |
          ./gradlew runFluidBenchmarkServer -PfluidFixture=fluids-v0241-ci
          ./gradlew runFluidBenchmarkServer -PfluidFixture=fluids-v0241-ci -PfluidMode=verify
      - name: Upload fluid evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factorycraft-fluid-performance
          if-no-files-found: ignore
          path: |
            run-benchmark/fluids-v0241-ci/reports/
            run-benchmark/fluids-v0241-ci/checkpoint.json
