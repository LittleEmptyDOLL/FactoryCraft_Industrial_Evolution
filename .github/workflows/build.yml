name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build
      - name: Server integration tests and disk reload
        run: |
          ./gradlew runGameTestServer
          ./gradlew runGameTestServer

      - name: Upload mod and reports
        uses: actions/upload-artifact@v4
        with:
          name: factorycraft-build
          path: |
            build/libs/*.jar
            build/reports/tests/
